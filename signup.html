<!DOCTYPE html>
<html>

<head>
    <title>Sign Up | Glo Girl Magazine</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>

        <div class="logo">
            GLO GIRL
            <span>MAGAZINE</span>
        </div>

        <nav>
            <a href="index.html">HOME</a>
            <a href="login.html">LOG IN</a>
        </nav>

    </header>


    <section class="login-section">

        <div class="login-box">

            <p class="login-small">JOIN GLO GIRL</p>

            <h1>SIGN UP</h1>

            <p class="login-intro">
                Create your Glo Girl account.
            </p>


            <form>

                <label for="name">NAME</label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    autocomplete="name"
                    required
                >


                <label for="email">EMAIL</label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    autocomplete="email"
                    required
                >


                <label for="password">PASSWORD</label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    autocomplete="new-password"
                    required
                >


                <label for="confirm-password">CONFIRM PASSWORD</label>

                <input
                    type="password"
                    id="confirm-password"
                    name="confirm-password"
                    autocomplete="new-password"
                    required
                >


                <button type="submit">
                    CREATE ACCOUNT
                </button>

            </form>


            <p class="signup-text">
                Already have an account?
                <a href="login.html">LOG IN</a>
            </p>

        </div>

    </section>

</body>

</html>
