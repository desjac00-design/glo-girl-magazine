<!DOCTYPE html>
<html>

<head>
    <title>Log In | Glo Girl Magazine</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>

        <div class="logo">
            GLO GIRL
            <span>MAGAZINE</span>
        </div>

        <nav>
            <a href="index.html">HOME</a>
        </nav>

    </header>


    <section class="login-section">

        <div class="login-box">

            <p class="login-small">WELCOME BACK</p>

            <h1>LOG IN</h1>

            <p class="login-intro">
                Sign in to your Glo Girl account.
            </p>

            <form>

                <label for="email">EMAIL</label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    autocomplete="username"
                    required
                >

                <label for="password">PASSWORD</label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    autocomplete="current-password"
                    required
                >

                <button type="submit">LOG IN</button>

            </form>

            <p class="signup-text">
                Don't have an account?
                <a href="signup.html">SIGN UP</a>
            </p>

        </div>

    </section>

</body>

</html>
